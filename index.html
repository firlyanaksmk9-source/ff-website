<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FREE FIRE WEBSITE</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:url('https://wallpapercave.com/wp/wp7418476.jpg');
    background-size:cover;
    background-position:center;
    height:100vh;
    overflow:hidden;
}

.overlay{
    background:rgba(0,0,0,0.7);
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.content h1{
    color:orange;
    font-size:70px;
    text-shadow:0 0 20px orange;
    margin-bottom:10px;
}

.content p{
    color:white;
    font-size:22px;
    margin-bottom:30px;
}

.btn{
    padding:15px 40px;
    background:orange;
    color:black;
    text-decoration:none;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:white;
    transform:scale(1.1);
}

</style>
</head>

<body>

<div class="overlay">
    <div class="content">
        <h1>FREE FIRE</h1>
        <p>Selamat Datang Di Website Free Fire Saya 🔥</p>

        <a href="#" class="btn">BOOYAH!</a>
    </div>
</div>

<audio autoplay loop>
  <source src="https://files.catbox.moe/6r8m6r.mp3" type="audio/mp3">
</audio>

</body>
</html>
